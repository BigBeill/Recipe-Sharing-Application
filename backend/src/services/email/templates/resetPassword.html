<!doctype html>
<html lang="en">
   <head>
      <meta charset="utf-8">
      <meta name="x-apple-disable-message-reformatting">
      <meta name="color-scheme" content="light dark">
      <meta name="supported-color-schemes" content="light dark">
      <title>Password Reset</title>
      <style>
         .btn{display:inline-block;padding:12px 18px;border-radius:6px;background:#065F46;color:#ffffff!important;text-decoration:none;font-weight:600}
         .card{max-width:560px;margin:0 auto;padding:24px;border:1px solid #eee;border-radius:10px;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
         p{line-height:1.5}
      </style>
   </head>
   <body>
      <div class="card">
         <img src="https://api.big-beills-kitchen.ca/emailAssets/BigBeill-logo-black.png" alt="Big Beill’s Kitchen" width="140" style="display:block;margin:0 auto 16px">
         <h2>Password reset</h2>
         <p>We received a request to reset your password.</p>
         <p><a class="btn" href="https://big-beills-kitchen.ca/auth/resetPassword#token={{resetString}}" target="_blank" rel="noopener">Reset your password</a></p>
         <p style="color:#666;font-size:12px;">This link expires after 30 minutes.</p>
      </div>
   </body>
</html>
